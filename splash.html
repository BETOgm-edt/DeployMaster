<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployMaster v2</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFF' stroke='%23FFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 22 2 2 22 2'></polygon></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background-color: #030303; 
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .pulse-glow {
            box-shadow: 0 0 50px rgba(255,255,255,0.4);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(255,255,255,0.2); transform: scale(1); }
            50% { box-shadow: 0 0 70px rgba(255,255,255,0.6); transform: scale(1.05); }
            100% { box-shadow: 0 0 30px rgba(255,255,255,0.2); transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">
    <div class="flex flex-col items-center gap-6 animate-[fadeIn_1s_ease-out]">
        <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center text-black pulse-glow">
            <i data-lucide="triangle" class="w-12 h-12 fill-current rotate-180"></i>
        </div>
        <div class="text-center">
            <h1 class="text-3xl font-bold text-white tracking-wider mb-2">DeployMaster</h1>
            <span class="px-2 py-1 rounded text-xs font-mono bg-[#222] text-[#888]">v2</span>
        </div>
        <div class="mt-8">
            <i data-lucide="loader-2" class="w-6 h-6 text-[#666] animate-spin"></i>
        </div>
    </div>
    <script>
        lucide.createIcons();
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3000);
    </script>
</body>
</html>
